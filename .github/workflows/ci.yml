name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock --group dev
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test Compose
        run: |
          docker compose up -d --build --wait --wait-timeout 60
          curl --fail --silent 'http://localhost:8000/v1/horoscopes/today?sign=leo&topic=work'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
      - run: docker build --target lambda .
