[project]
name = "agata-horoscopes"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.115,<1",
    "grpcio>=1.85.4,<2",
    "httpx>=0.28,<1",
    "mangum>=0.19,<1",
    "protobuf>=7.35.1,<8",
    "pydantic-settings>=2,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "grpcio-tools==1.85.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.setuptools.packages.find]
include = ["agata*"]
